services:
  db:
    image: postgres:16.4
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5
    env_file: ./server/.env
    ports:
      - 5432:5432

volumes:
  postgres_data:
