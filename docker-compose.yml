services:
  db:
    image: postgres:16.4
    restart: unless-stopped
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5
    ports:
      - 5432:5432

  server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      WEEDSCAN_INFERENCE_URL: http://weedscan-inference:8100/predict
    ports:
      - 8000:8081
    depends_on:
      db:
        condition: service_healthy
      weedscan-inference:
        condition: service_healthy

  weedscan-inference:
    build:
      context: .
      dockerfile: inference/Dockerfile
    restart: unless-stopped
    environment:
      MODEL_DIR: /models
    volumes:
      - weedscan-model:/models
    ports:
      - 8100:8100
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

volumes:
  weedscan-model:
